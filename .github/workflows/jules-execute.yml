name: Jules Execute Dispatcher

on:
  repository_dispatch:
    types: [jules_execute]

jobs:
  create_execute_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Execute Issue for Jules
        uses: actions/github-script@v6
        with:
          script: |
            const payload = context.payload.client_payload;
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[${payload.session_id}] ${payload.title}`,
              body: `${payload.description}\n\n@jules 请执行此任务。`,
              labels: ['agent-dispatched']
            });
            console.log(`Created execute issue #${issue.data.number}`);
