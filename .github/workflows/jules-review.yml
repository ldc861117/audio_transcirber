name: Jules Review Dispatcher

on:
  repository_dispatch:
    types: [jules_review]

jobs:
  create_review_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Review Issue for Jules
        uses: actions/github-script@v6
        with:
          script: |
            const payload = context.payload.client_payload;
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[${payload.session_id}] Review: ${payload.title}`,
              body: `${payload.description}\n\n@jules 请审查此任务的代码变更。`,
              labels: ['jules-review']
            });
            console.log(`Created review issue #${issue.data.number}`);
