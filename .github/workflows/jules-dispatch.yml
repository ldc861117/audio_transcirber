name: Jules Plan Dispatcher

on:
  repository_dispatch:
    types: [jules_plan]

permissions:
  issues: write
  contents: read

jobs:
  create_plan_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Plan Issue for Jules
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const payload = context.payload.client_payload;
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[${payload.session_id}] Plan: ${payload.title}`,
              body: payload.description,
              labels: ['jules-plan']
            });
            console.log(`Created plan issue #${issue.data.number}`);
