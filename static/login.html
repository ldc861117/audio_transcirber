<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 — Audio Transcriber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <span class="brand-icon">🎙️</span>
        <h1 class="auth-title">音频转写</h1>
        <p class="auth-subtitle">登录以继续</p>
      </div>
      <form id="loginForm" autocomplete="on">
        <div class="auth-field">
          <label for="username">用户名</label>
          <input id="username" type="text" placeholder="请输入用户名" autocomplete="username" required />
        </div>
        <div class="auth-field">
          <label for="password">密码</label>
          <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" required />
        </div>
        <div class="auth-error" id="errorMsg"></div>
        <button class="btn btn-primary auth-submit" type="submit">登录</button>
      </form>
      <p class="auth-link">还没有账号？ <a href="/register">注册</a></p>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById("errorMsg");
      const btn = e.target.querySelector("button[type=submit]");
      errorMsg.textContent = "";
      btn.disabled = true;
      btn.textContent = "登录中...";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = "/";
        } else {
          errorMsg.textContent = data.error || "登录失败";
        }
      } catch {
        errorMsg.textContent = "网络错误，请重试";
      } finally {
        btn.disabled = false;
        btn.textContent = "登录";
      }
    });
  </script>
</body>

</html>
